services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "GLMSPassword123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    networks:
      - glms-network
    volumes:
      - sqldata:/var/opt/mssql

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.API/Dockerfile
    container_name: glms-backend-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server-db,1433;Database=GLMSDB;User Id=sa;Password=GLMSPassword123!;TrustServerCertificate=True;
      - Jwt__Key=ThisIsASecretKeyForGLMSApp1234567890!!
      - Jwt__Issuer=GLMS.API
      - Jwt__Audience=GLMS.MVC
    ports:
      - "5261:8080"
    depends_on:
      - sql-server-db
    networks:
      - glms-network

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS/Dockerfile
    container_name: glms-frontend-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://glms-backend-api:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server-db,1433;Database=GLMSDB;User Id=sa;Password=GLMSPassword123!;TrustServerCertificate=True;
    ports:
      - "8080:8080"
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge

volumes:
  sqldata: